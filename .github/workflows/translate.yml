name: Translate posts

on:
  schedule:
    # Daily at 06:00 UTC — catches new Substack posts within a day.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build (populates translation cache)
        run: npm run build
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}

      - name: Commit updated translation cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/translation-cache.json
          if git diff --staged --quiet; then
            echo "No new translations."
          else
            git commit -m "Update translation cache"
            git push
          fi
